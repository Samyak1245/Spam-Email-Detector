<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Email Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Spam Email Detector</h1>

        <form method="POST" id="spamForm">
            <textarea id="message" name="message" placeholder="Paste your email or message here...">{{ message }}</textarea>
            <div class="buttons">
                <button type="submit" id="checkBtn">Check</button>
                <button type="button" id="clearBtn">Clear</button>
            </div>
        </form>

        {% if result %}
            <div class="result {{ 'spam' if result == 'SPAM' else 'ham' }}">
                {{ result }}
                <div class="conf">Confidence: {{ confidence }}%</div>
            </div>
        {% endif %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
