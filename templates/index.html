
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Email Classifier</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="container">
        <h1>Spam Email Classifier</h1>
        <p class="subtitle">
            Enter an email message to check whether it is spam.
        </p>

        <form method="POST" id="classifier-form">
            <label for="message">Email content</label>

            <textarea
                id="message"
                name="message"
                placeholder="Paste your email here..."
                required
            >{{ message or '' }}</textarea>

            <div class="form-footer">
                <span id="char-count">0 characters</span>
                <button type="button" id="clear-button">Clear</button>
            </div>

            <button type="submit" class="submit-button">
                Classify Email
            </button>
        </form>

        {% if result %}
        <section class="result
            {{ 'spam' if result == 'Spam' else 'not-spam' }}"
            aria-live="polite">

            <h2>{{ result }}</h2>
            <p>Model confidence: {{ confidence }}%</p>

        </section>
        {% endif %}

        <p class="note">
            Results are predictions from a machine-learning model
            and may not always be correct.
        </p>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
